# secrets manager -> file mount using the pod's own role. no k8s Secret object. not mounted yet, app doesn't need one
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: testing-node-server
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: prod/testing-node-server/app
        objectType: secretsmanager
        objectAlias: app.json
