apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testing-node-server
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # pod IPs directly - no extra hop through a node (cross-AZ $), and readiness gates need it
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # terraform output alb_security_group_id (HTTPS in, app port out to the nodes only)
    alb.ingress.kubernetes.io/security-groups: sg-REPLACE_ME
    # terraform output certificate_arn
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:111122223333:certificate/REPLACE_ME
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # must be shorter than the 20s preStop
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
    # bucket comes from terraform (buckets["alb-logs"]), kept 30 days
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=testing-node-server-prod-alb-logs-111122223333
spec:
  ingressClassName: alb
  rules:
    - host: testing-node-server.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testing-node-server
                port:
                  name: http
