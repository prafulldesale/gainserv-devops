apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testing-node-server
spec:
  # Scale this app based on CPU usage
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: testing-node-server
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60