apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-node-server
spec:
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # zero-downtime: old pod only goes away once its replacement is ready
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: testing-node-server
  template:
    metadata:
      labels:
        app: testing-node-server
    spec:
      # pod maps this SA to the app's IAM role
      serviceAccountName: testing-node-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # non root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: testing-node-server
      
      containers:
        - name: app
          image: testing-node-server
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            # node is single threaded, more than 1 core is wasted
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          # /healthz shares the event loop with /compute, so it's slow under load - don't be too strict
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # deliberately lax (~60s). restarting a busy pod just pushes load onto the others
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            # app has no SIGTERM handling. keep serving while the ALB/endpoints drain us
            preStop:
              sleep:
                seconds: 20